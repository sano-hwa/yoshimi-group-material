<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>吉見グループ株式会社 ― FVアニメーション デモ</title>
<style>
  :root{
    --navy:#12294f;
    --blue1:#27539B;
    --blue2:#4d8fce;
    --blue3:#83c2e4;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    background:#0c1626;
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
    color:#fff;
  }

  /* ---------- demo chrome (not part of the client's site) ---------- */
  .demo-wrap{
    width:100%;
    max-width: 1800px;
    margin: 0 auto;
    position:relative;
  }
  .demo-label{
    position:fixed;
    top:14px;
    left:14px;
    z-index:100;
    background:rgba(12,22,38,.72);
    backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.18);
    border-radius:10px;
    padding:8px 14px;
    font-size:12px;
    letter-spacing:.06em;
    line-height:1.6;
  }
  .demo-label b{color:#8fd0ff;}

  .demo-panel{
    position:fixed;
    bottom:16px;
    left:14px;
    z-index:100;
    background:rgba(12,22,38,.72);
    backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.18);
    border-radius:12px;
    padding:12px 16px;
    font-size:12px;
    display:flex;
    flex-direction:column;
    gap:8px;
    min-width:220px;
  }
  .demo-panel .row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .demo-panel button{
    background:#1c3a66;
    border:1px solid rgba(255,255,255,.25);
    color:#fff;
    border-radius:7px;
    padding:6px 12px;
    font-size:12px;
    cursor:pointer;
    font-family:inherit;
  }
  .demo-panel button:hover{background:#27539B;}
  .demo-panel input[type=range]{width:110px;accent-color:#5ba7e8;}
  .demo-panel .cap{opacity:.75;font-size:11px;}

  /* ---------- hero ---------- */
  .hero{
    position:relative;
    width:100%;
    height:100dvh;
    overflow:hidden;
    /* background:
      radial-gradient(120% 90% at 18% 8%, rgba(140,190,235,.35) 0%, rgba(140,190,235,0) 55%),
      linear-gradient(135deg, #0d3f74 0%, #12294f 45%, #0a1830 100%); */
      background: url(bg.png) no-repeat center/cover;
  }
  .hero-shade{
    position:absolute;
    inset:0;
    background:linear-gradient(180deg, rgba(10,25,55,.10) 0%, rgba(10,25,55,0) 30%, rgba(6,16,34,.35) 78%, rgba(6,16,34,.08) 100%);
    pointer-events:none;
  }

  /* header */
  .site-header{
    position:absolute;
    top:0;left:0;right:0;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:1.8% 3.1%;
  }
  .logo{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .logo-mark{
    width:44px;height:44px;
    border-radius:50%;
    background:#fff;
    display:flex;align-items:center;justify-content:center;
    color:var(--navy);
    font-family:Georgia, "Times New Roman", serif;
    font-weight:700;
    font-size:20px;
    flex-shrink:0;
  }
  .logo-text .en{
    font-family:Georgia,"Times New Roman",serif;
    font-style:italic;
    font-size:10px;
    letter-spacing:.12em;
    opacity:.9;
  }
  .logo-text .jp{
    font-size:17px;
    font-weight:700;
    letter-spacing:.02em;
    margin-top:1px;
  }
  nav{
    display:flex;
    align-items:center;
    gap:26px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.14);
    padding:12px 22px;
    border-radius:8px;
    backdrop-filter:blur(3px);
  }
  nav a{
    color:#fff;
    text-decoration:none;
    font-size:13.5px;
    letter-spacing:.02em;
    white-space:nowrap;
    opacity:.95;
  }
  nav .menu-btn{
    background:var(--navy);
    padding:8px 16px;
    border-radius:6px;
    font-weight:700;
    letter-spacing:.08em;
    font-size:12px;
  }

  /* wave ribbon layer */
  .ribbon-svg{
    width:104%;
    height:auto;
    z-index:5;
    overflow:visible;
    filter:drop-shadow(0 0 18px rgba(60,130,220,.08));
  }
  .wl{
    fill:none;
    stroke-miterlimit:10;
    animation-name:waveBob;
    animation-duration:calc(6.4s / var(--speed, 1));
    animation-timing-function:cubic-bezier(.45,0,.55,1);
    animation-iteration-count:infinite;
    transform-box:fill-box;
    transform-origin:center;
  }
  @keyframes waveBob{
    0%   { transform: translate(0px, -1px); }
    25%  { transform: translate(3px, 5px); }
    50%  { transform: translate(0px, 1px); }
    75%  { transform: translate(-3px, -6px); }
    100% { transform: translate(0px, -1px); }
  }
  .ribbon-group{
    animation:ribbonDrift calc(22s / var(--speed,1)) ease-in-out infinite;
    transform-box:view-box;
  }
  @keyframes ribbonDrift{
    0%{ transform:translate(0px,0px); }
    50%{ transform:translate(-14px,4px); }
    100%{ transform:translate(0px,0px); }
  }

  /* hero copy */
  .hero-copy{
    position:absolute;
    z-index:15;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .hero-copy h1{
    font-size:clamp(28px,3.6vw,54px);
    line-height:1.32;
    font-weight:700;
    letter-spacing:.02em;
    text-shadow:0 2px 18px rgba(0,20,50,.35);
  }
  .hero-copy p{
    margin-top:26px;
    font-size:clamp(12px,1.05vw,16px);
    line-height:1.9;
    letter-spacing:.03em;
    opacity:.95;
    text-shadow:0 1px 10px rgba(0,20,50,.35);
  }

  .svgbox {
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0px;
    left: 0px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
  }


  /* bottom sine wave */
  .bottom-wave{
    position:absolute;
    left:0;right:0;bottom:-1px;
    width:100%;
    height:34%;
    z-index:18;
    display:block;
  }

  /* anniversary badge */
  .badge{
    position:absolute;
    right:4.6%;
    bottom:7.5%;
    z-index:20;
    background:#fff;
    color:var(--navy);
    border-radius:14px;
    padding:16px 22px 14px;
    width:23%;
    min-width:220px;
    box-shadow:0 14px 34px rgba(0,10,30,.28);
  }
  .badge .num{
    display:flex;
    align-items:baseline;
    gap:4px;
    font-family:Georgia,"Times New Roman",serif;
    font-weight:700;
  }
  .badge .num .big{
    font-size:clamp(30px,3.4vw,46px);
    color:#1a5fb4;
    letter-spacing:-.02em;
  }
  .badge .num .th{
    font-size:clamp(13px,1.3vw,18px);
    color:#1a5fb4;
  }
  .badge .sub{
    font-size:clamp(10px,.9vw,13px);
    letter-spacing:.08em;
    font-weight:700;
    margin-top:2px;
  }
  .badge .link{
    display:block;
    margin-top:10px;
    text-align:center;
    border-top:1px solid #dbe4f0;
    padding-top:10px;
    font-size:clamp(9px,.85vw,11.5px);
    color:#1a5fb4;
    text-decoration:none;
    font-weight:700;
  }

  @media (prefers-reduced-motion: reduce){
    .wl, .ribbon-group{ animation:none !important; }
  }
</style>
</head>

    <div class="hero-copy">
      <h1>つなぐ力が、<br>未来を動かす。</h1>
      <p>物流を中核に、多様な事業を通じて<br>豊かな地域社会づくりに貢献します。</p>
    </div>

    <div class="badge">
      <div class="num"><span class="big">100</span><span class="th">TH</span></div>
      <div class="sub">100年の歩みと、その先へ</div>
      <a class="link" href="#">創業100周年特設サイトはこちら</a>
    </div>

    <svg class="bottom-wave" viewBox="0 0 1512 340" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path id="waveBack" fill="#ffffff" opacity="0.35"></path>
      <path id="waveFront" fill="#ffffff"></path>
    </svg>
  </section>
</div>

<div class="demo-panel">
  <div class="row">
    <span>波のアニメーション</span>
    <button id="toggleBtn">一時停止</button>
  </div>
  <div class="row">
    <span class="cap">速度</span>
    <input id="speedRange" type="range" min="0.3" max="2.5" step="0.1" value="1">
  </div>
  <div class="cap">※ 検証用デモページです</div>
</div>

<script>
(function(){
  // ---- stagger the ribbon line animations so the motion travels like a sine wave ----
  var lines = document.querySelectorAll('.wl');
  lines.forEach(function(el, i){
    var delay = -(i * 0.085);           // phase offset per line -> traveling wave
    var durJit = 1 + ((i % 7) - 3) * 0.02; // tiny duration jitter for organic feel
    el.style.animationDelay = delay + 's';
    el.style.animationDuration = 'calc((6.4s / var(--speed,1)) * ' + durJit + ')';
  });

  // ---- root speed control (drives CSS var --speed used by ribbon keyframes) ----
  var root = document.documentElement;
  var speed = 1;
  var paused = false;
  root.style.setProperty('--speed', speed);

  var speedRange = document.getElementById('speedRange');
  speedRange.addEventListener('input', function(){
    speed = parseFloat(this.value);
    root.style.setProperty('--speed', speed);
  });

  var toggleBtn = document.getElementById('toggleBtn');
  toggleBtn.addEventListener('click', function(){
    paused = !paused;
    document.body.style.setProperty('animation-play-state', paused ? 'paused':'running');
    var all = document.querySelectorAll('.wl, .ribbon-group');
    all.forEach(function(el){ el.style.animationPlayState = paused ? 'paused' : 'running'; });
    toggleBtn.textContent = paused ? '再生' : '一時停止';
    waveRunning = !paused;
  });

  // ---- bottom "cut" as a genuinely animated sine wave ----
  var front = document.getElementById('waveFront');
  var back  = document.getElementById('waveBack');
  var W = 1512, H = 340;
  var t = 0;
  var waveRunning = true;

  // base diagonal (lower-left -> higher-right), like the reference cut,
  // with two summed sine terms for an organic, non-mechanical wave shape.
  function buildPath(phase, baseOffset, a1, a2, f1, f2){
    var pts = [];
    var steps = 60;
    for (var s = 0; s <= steps; s++){
      var x = (W / steps) * s;
      var diag = H*0.62 - (x / W) * (H*0.30); // slopes up toward the right
      var y = diag
             + Math.sin((x / W) * Math.PI * f1 + phase) * a1
             + Math.sin((x / W) * Math.PI * f2 - phase * 1.3) * a2
             + baseOffset;
      pts.push([x, y]);
    }
    var d = 'M 0 ' + H + ' L 0 ' + pts[0][1].toFixed(1);
    for (var i = 1; i < pts.length; i++){
      var prev = pts[i-1], cur = pts[i];
      var midX = (prev[0] + cur[0]) / 2;
      d += ' Q ' + prev[0].toFixed(1) + ' ' + prev[1].toFixed(1) + ' ' + midX.toFixed(1) + ' ' + ((prev[1]+cur[1])/2).toFixed(1);
    }
    d += ' L ' + W + ' ' + pts[pts.length-1][1].toFixed(1) + ' L ' + W + ' ' + H + ' Z';
    return d;
  }

  function tick(){
    if (waveRunning){
      t += 0.010 * speed;
      front.setAttribute('d', buildPath(t, 0, 10, 6, 1.6, 2.6));
      back.setAttribute('d',  buildPath(t*0.8 + 1.2, -16, 14, 8, 1.3, 2.1));
    }
    requestAnimationFrame(tick);
  }
  tick();
})();
</script>
